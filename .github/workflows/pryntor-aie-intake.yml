name: Pryntor AIE public research skill CI

on:
  pull_request:
    paths:
      - 'skills/.experimental/pryntor-ai-engineer-research/**'
      - '.github/workflows/pryntor-aie-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aie-intake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-validator:
    name: Offline research-skill validator (no API access)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: skills/.experimental/pryntor-ai-engineer-research
    steps:
      - name: Checkout review commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Byte-compile public catalog and tests
        run: python -m compileall -q catalog.py test_catalog.py
      - name: Exercise deterministic offline tests
        run: python -m unittest discover -v -p 'test_*.py'
