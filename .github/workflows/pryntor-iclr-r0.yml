name: Pryntor ICLR R0 offline validation
on:
  pull_request:
    paths:
      - 'skills/.experimental/pryntor-iclr-research-intake/**'
      - '.github/workflows/pryntor-iclr-r0.yml'
permissions:
  contents: read
jobs:
  structural-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python syntax and all isolated tests
        run: |
          python3 -m py_compile skills/.experimental/pryntor-iclr-research-intake/research_index.py skills/.experimental/pryntor-iclr-research-intake/test_research_index.py
          python3 -m unittest discover -s skills/.experimental/pryntor-iclr-research-intake -p 'test_*.py' -v
